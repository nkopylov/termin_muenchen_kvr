[project]
name = "notfall-termin-abh-muenchen-bot"
version = "2.0.0"
description = "Munich appointment booking notification bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.34.2",
    "python-telegram-bot>=22.8",
    "python-dotenv>=1.2.4",
    # Configuration & Validation
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    # Database
    "sqlmodel>=0.0.48",
    # Analytics
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]
